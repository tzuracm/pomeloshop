<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7b500" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<title>Pomelo Shop · 柚子下单</title>
<meta name="description" content="泰国柚子在线下单 · PromptPay 扫码支付 · 无需注册" />

<!--
  ============================================================================
  Pomelo Shop — single-file storefront
  ============================================================================
  All CSS lives in styles.css, all logic in app.js. Both are plain static
  assets served by Vercel; no build step is required.
  ============================================================================
-->

<link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- ===================== Header ===================== -->
  <header class="hero">
    <div class="emoji">🍊</div>
    <h1 id="shopName">Pomelo Shop</h1>
    <p id="shopSubtitle">泰国金柚 · 扫码下单 · 无需注册</p>
  </header>

  <!-- ===================== Global alerts ===================== -->
  <div id="configAlert" class="alert error"></div>
  <div id="formAlert" class="alert error"></div>

  <!-- ===================== Order form ===================== -->
  <main id="orderFlow">

    <!-- Step 1 — contact -->
    <section class="card">
      <h2><span class="step">1</span> 联系方式</h2>

      <div class="field">
        <label for="wechatName">微信名 / 称呼</label>
        <input
          type="text"
          id="wechatName"
          name="wechatName"
          autocomplete="nickname"
          placeholder="例如：小明"
          maxlength="40"
          required />
      </div>

      <div class="field">
        <label for="phone">联系电话 <span class="hint">（用于配送联系）</span></label>
        <input
          type="tel"
          id="phone"
          name="phone"
          autocomplete="tel"
          inputmode="tel"
          placeholder="例如：0812345678"
          maxlength="20"
          required />
      </div>
    </section>

    <!-- Step 2 — delivery method (交货方式) -->
    <section class="card">
      <h2><span class="step">2</span> 交货方式</h2>

      <!-- Collapsed single-select: shows the current choice; click to expand
           the full option list. Options are rendered from /api/config
           (pomelo_delivery_methods). -->
      <div class="select" id="deliverySelect">
        <button type="button" class="select-trigger" id="deliveryTrigger"
                aria-haspopup="listbox" aria-expanded="false">
          <span class="select-value" id="deliveryValue">加载中…</span>
          <span class="select-caret" aria-hidden="true">▾</span>
        </button>
        <div class="select-menu" id="deliveryMenu" role="listbox" aria-label="交货方式"></div>
      </div>

      <div class="delivery-details" id="deliveryDetails"></div>
    </section>

    <!-- Step 3 — catalogue -->
    <section class="card">
      <h2><span class="step">3</span> 选择规格</h2>
      <div id="catalogue"></div>

      <div class="total-bar">
        <span class="label">合计</span>
        <span class="amount"><span class="cur">฿</span><span id="totalAmount">0</span></span>
      </div>
    </section>

    <!-- Step 4 — PromptPay QR -->
    <section class="card">
      <h2><span class="step">4</span> 扫码支付</h2>
      <div class="qr-wrap">
        <div class="qr-frame" id="qrFrame">
          <div class="placeholder">选择规格后<br />自动生成支付二维码</div>
        </div>
        <div class="qr-amount" id="qrAmount"></div>
        <p class="qr-hint">
          使用手机银行 App 扫码，或截图后在 App 中识别<br />
          支付完成后请上传转账凭证
        </p>
        <span class="pp-id" id="ppId"></span>
      </div>
    </section>

    <!-- Step 5 — slip upload + submit -->
    <section class="card">
      <h2><span class="step">5</span> 上传转账凭证</h2>

      <label class="dropzone" id="dropzone" for="slipInput">
        <span class="icon">📎</span>
        <span class="title">点击上传或拖拽图片到此处</span>
        <span class="sub">支持 JPG / PNG / WEBP，最大 8 MB</span>
        <input type="file" id="slipInput" accept="image/*" />
      </label>

      <div class="slip-preview" id="slipPreview">
        <img id="slipImg" alt="转账凭证预览" />
        <button type="button" class="remove" id="removeSlip" aria-label="移除图片">✕</button>
      </div>

      <div style="height:16px"></div>

      <button type="button" class="btn" id="submitBtn" disabled>
        <span id="submitLabel">提交订单</span>
      </button>
    </section>

  </main>

  <!-- ===================== Success screen ===================== -->
  <section class="success-screen" id="successScreen">
    <div class="tick">✓</div>
    <h2>下单成功！</h2>
    <p>我们已收到你的订单与转账凭证。</p>
    <p>确认收款后会尽快按所选交货方式与你联系。</p>
    <div class="ref" id="orderRef"></div>
  </section>

  <!-- ===================== Social proof toast ===================== -->
  <!--
    Floating "someone just ordered / N people browsing" card. Purely
    client-side simulated data (see initSocialProof in app.js). Hidden by
    default; app.js adds .show to animate it in.
  -->
  <div class="sp-toast" id="socialProofToast" role="status" aria-live="polite" aria-atomic="true">
    <span class="sp-icon" id="spIcon" aria-hidden="true">🛒</span>
    <span class="sp-text" id="spText"></span>
    <button type="button" class="sp-close" id="spClose" aria-label="关闭提示">✕</button>
  </div>

  <footer>
    <div id="footerShop">Pomelo Shop</div>
    <div>支付由 PromptPay 提供 · 数据存储于 Supabase</div>
  </footer>

  <!-- ===================== Libraries ===================== -->
  <!--
    qrcode-generator : UMD QR encoder (window.qrcode), zero dependencies
    supabase-js      : storage upload + table insert
  -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <!-- Runtime config loader (fetches /api/config) -->
  <script src="/config.js"></script>

  <!-- Application logic -->
  <script src="/app.js"></script>
</body>
</html>
